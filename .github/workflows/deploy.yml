name: Deploy Presensi to Production

on:
  push:
    branches:
      - main # Jalankan otomatis ketika ada push ke branch main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest

      - name: 4. Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.txt # Sesuaikan jika nanti filenya bernama Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 5. Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          envs: GITHUB_TOKEN
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            
            # Pindah ke folder instalasi
            cd /var/www/html/presensi
            
            # Tarik docker-compose.yml terbaru dari git menggunakan token otomatis
            git config --global --add safe.directory /var/www/html/presensi
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
            git fetch --all
            git reset --hard origin/main
            
            # Login ke GHCR di dalam server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull image terbaru dari GHCR
            docker compose pull app
            
            # Ekstrak folder public dari image agar bisa dibaca oleh Nginx
            # (Karena Nginx berada di container terpisah dan butuh file statis CSS/JS)
            docker create --name temp_presensi_app ghcr.io/${{ env.IMAGE_NAME }}:latest
            docker cp temp_presensi_app:/var/www/html/public ./public-build
            docker rm temp_presensi_app
            
            # Restart container
            docker compose up -d
            
            # Jalankan migrasi dan optimasi Laravel
            docker exec presensi_app php artisan migrate --force
            docker exec presensi_app php artisan optimize:clear
            docker exec presensi_app php artisan config:cache
            docker exec presensi_app php artisan route:cache
            docker exec presensi_app php artisan view:cache