name: Deploy to Production Server

on:
  push:
    branches:
      - main # Jalankan otomatis ketika ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          envs: GITHUB_TOKEN
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }} # Biasanya 22
          script: |
            set -e
            
            # PENTING: JANGAN DIKOMENTARI (#). Jika lokasi folder di server Anda berbeda, 
            # SILAKAN UBAH path "/var/www/html/presensi" ke lokasi yang benar.
            cd /var/www/html/presensi

            # Pull kode terbaru dari GitHub secara paksa (menggunakan token agar tidak perlu login)
            git config --global --add safe.directory /var/www/html/presensi
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/itbcslogistics/presensi-app.git
            git fetch --all
            git reset --hard origin/main
            
            # Memastikan image menggunakan base terbaru dan mem-build ulang image aplikasi
            docker compose build --pull
            
            # Menjalankan atau merestart container di background
            docker compose up -d
            
            # Menjalankan migrasi database di dalam container aplikasi
            docker exec presensi_app php artisan migrate --force
            
            # Membersihkan cache aplikasi di dalam container
            docker exec presensi_app php artisan optimize:clear
            docker exec presensi_app php artisan config:cache
            docker exec presensi_app php artisan route:cache
            docker exec presensi_app php artisan view:cache
