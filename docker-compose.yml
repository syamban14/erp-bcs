version: '3.8'

services:
  app:
    image: ghcr.io/${IMAGE_NAME:-itbcslogistics/presensi-app}:latest
    container_name: presensi_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.env:/var/www/html/.env
      - presensi_storage:/var/www/html/storage
    networks:
      - presensi-network

  nginx:
    image: nginx:alpine
    container_name: presensi_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./public-build:/var/www/html/public
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - presensi-network

networks:
  presensi-network:
    driver: bridge

volumes:
  presensi_storage:
